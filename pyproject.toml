[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "coremeta4cat"
description = "A metadata collection for catalysis related research"
authors = [
  {name = "Hendrik Borgelt", email = "hendrik.borgelt@tu-dortmund.de"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.12.1",
]

[dependency-groups]
dev = [
    "linkml>=1.12.1",
    "mike>=2.0",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.0",
    "ruamel-yaml>=0.18",   # comment-preserving YAML round-trip for inbox_to_schema.py
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/coremeta4cat/datamodel/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/coremeta4cat/datamodel/*",
]

[tool.uv]
constraint-dependencies = [
    # GitPython security fixes
    "GitPython>=3.2.1",

    # Jupyter security fixes
    "jupyter-server>=2.21.1",
    "jupyterlab>=4.6.6",
    "notebook>=7.6.5",
    "nbconvert>=7.17.2",

    # HTTP and TLS security fixes
    "urllib3>=2.8.0",
    "anyio>=4.16.0",
    "certifi>=2026.11.20",

    # Parser and web server security fixes
    "mistune>=3.4.0",
    "tornado>=6.6.1",
]
