        to: ["used_solvent[solvent].title", "used_solvent[solvent].composed_of[chem].title"]
        as: text
        basis: direct
        why: >-
          voc4cat:0007246 is an exact mapping of DissolvingSubstance, the range of used_solvent.
          The InChI goes to the constituent ChemicalEntity, as in column K.
      - col: P
        header: solvent Inchi
        to: "used_solvent[solvent].composed_of[chem].inchi[]"
        as: qualitative
        basis: direct
        why: As column L.
