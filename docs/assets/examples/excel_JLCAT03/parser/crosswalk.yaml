        header: Reactor (AFE:0000153)
        to: used_reactor[reactor].reactor_designator
        as: enum
        values: {"Autoclave (NCIT:C93052)": "NCIT:C93052"}
        basis: direct
        why: >-
          AFE:0000153 is the class_uri of Reactor; the value names NCIT:C93052, the class_uri
          of the subclass Autoclave, declared with reactor_designator so that its slots
          (columns U-Y) can be used.
      - col: R
        header: Reactor (AFE:0000153)
        to: used_reactor[reactor].title
        as: text
        strip_curie: true
        basis: direct
        why: Reactor name without the term in brackets.
      - col: S
        header: device ID (AFR_0002018)
        to: "used_reactor[reactor].other_identifier[]"
        as: identifier
        attrs: {description: "device identifier (AFR_0002018) assigned in the source workbook"}
        basis: direct
        why: >-
          AFR_0002018 is the Allotrope term 'device identifier'; kept as other_identifier of
          the reactor and used in its IRI.
      - col: T
        header: operation mode (voc4cat:0000108)
        to: "used_reactor[reactor].has_qualitative_attribute[]"
        as: qualitative
        attrs:
          title: operation mode
          rdf_type: {id: "voc4cat:0000108", title: operation mode}
        basis: schema-forced
        why: >-
          voc4cat:0000108 'operation mode' is how reactants enter and products leave the
          reaction chamber (batch, continuous flow). Neither CatalyticReaction nor Autoclave
          has an operation-mode slot (has_operation_mode is only on characterization
          techniques), so it is a generic QualitativeAttribute of the reactor, typed with the
          voc4cat term. The column sits among the reactor columns (R-Y).
      - col: U
        header: stirrer type (voc4cat:0008113)
        to: "used_reactor[reactor].reactor_stirrer_type[]"
        as: text
        basis: direct
        why: >-
          voc4cat:0008113 is the slot_uri of both stirrer_type (synthesis) and
          reactor_stirrer_type (Autoclave); this is the reactor's.
      - col: V
