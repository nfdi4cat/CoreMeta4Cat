        to: "used_reactor[reactor].stirring_rate[]"
        as: quantity
        kind: AngularVelocity
        basis: direct
        why: >-
          voc4cat:0008114 is the slot_uri of stirring_rate (Autoclave) and of has_stirring_speed
          (synthesis); this is the reactor's.
      - col: W
        header: stirrer diameter (voc4cat:0008115)
