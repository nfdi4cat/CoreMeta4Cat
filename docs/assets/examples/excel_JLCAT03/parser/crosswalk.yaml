        as: quantity
        kind: Length
        basis: direct
        why: voc4cat:0008115 is the slot_uri of stirrer_diameter (Autoclave).
      - col: X
        header: reaction chamber volume (voc4cat:0000153)
        to: "used_reactor[reactor].reactor_working_volume[]"
        as: quantity
        kind: Volume
        attrs: {description: "vessel only, without fittings or connections (data provider, Q12)"}
        basis: direct
        why: >-
          voc4cat:0000153 is the slot_uri of reactor_working_volume (Autoclave). voc4cat's
          definition includes connected pipes and valves, the slot's excludes them; the data
          provider confirmed the vessel alone (Q12), which matches the slot.
      - col: Y
        header: reaction chamber shape (voc4cat:0000155)
        to: "used_reactor[reactor].reaction_chamber_shape[]"
        as: text
        basis: direct
        why: voc4cat:0000155 is the slot_uri of reaction_chamber_shape (Autoclave).
      - col: Z
        header: reaction temperature (voc4cat:0007013)
        to: "has_temperature[]"
        as: quantity
        kind: Temperature
        unit: DEG_C
        unit_note: >-
          degC, confirmed by the data provider (Q4). It was deduced first: the reactor
