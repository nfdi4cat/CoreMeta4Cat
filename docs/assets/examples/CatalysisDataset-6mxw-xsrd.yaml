    metal fractions) under conditions 1-8 of the test protocol: 80 bar, 225-300 C, GHSV 3000 h-1 (condition
    1: 6000 h-1), CO2 13-27.1 vol%, CO 0-15.8 vol%, H2 63.3-76 vol%, 5 vol% Ar, N2 balance. Same 16-fold
    fixed-bed reactor and pretreatment as the optimized catalysts. The highest combined MeOH + DME yields
    were found for Cu0.40Ga0.07Al0.53 and Cu0.33Ga0.07Al0.60 (article, section 3.3); yields are not deposited.'
