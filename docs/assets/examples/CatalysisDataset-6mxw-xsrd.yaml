id: hdl:21.11165/4cat/6mxw-xsrd
title:
- Copper Gallium Aluminum Mixed Metal Oxides as Alternative Catalyst Candidates for Efficient Conversion
  of Carbon Dioxide to Methanol and Dimethyl Ether
description:
- 'Data from Weber et al., ACS Catal. 2025, 15, 18857: DFT and machine-learned-potential (EquiformerV2/OCP,
  MACE-MPA-0) binding energies of OH and CO used to screen active phases; nominal and XRF compositions
  of 76 co-precipitated Cu-Ga-Al hydrotalcite-like precursors; the 13 compositions of the initial activity
  screening; calcination temperatures of the seven optimized catalysts; and the 17-condition test protocol
  for CO2/CO hydrogenation to methanol and dimethyl ether at 80 bar in a 16-fold fixed-bed reactor. Catalytic
  results (conversions, yields) and further characterization (PXRD, N2 sorption, TPR, N2O-RFC, TEM) are
  reported in the article but not deposited.'
