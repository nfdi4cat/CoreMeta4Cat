title:
- 'Dataset for Publication: Experimental and Microkinetic Investigation of Thermo-Catalytic Ammonia Decomposition
  over a Ba-promoted Ru/Ni-BCZY Catalyst for Use in Ammonia-fed Protonic Ceramic Cells'
description:
- 'Data from Davari et al., Appl. Catal. A 708 (2025) 120571: H2-TPR of the Ni-BCZY cermet; NH3 decomposition
  light-off curves of six Ru/Ba catalysts on Ni-BCZY, Ni-YSZ and YSZ at 500-3000 ppm NH3 in a packed bed
  (1 bar, GHSV 50,000 h-1); and DETCHEM microkinetic packed-bed simulations: comparison with the experiments
  for literature and optimized parameters, axial and surface-coverage profiles, turnover frequencies,
  and variation of inlet NH3, GHSV and pressure. File names follow the figures of a version of the article;
  from Fig6 on they do not match the published figure numbers.'
