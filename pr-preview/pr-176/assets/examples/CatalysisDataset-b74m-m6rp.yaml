  activity_designator: Simulation
  title:
  - Microkinetic simulation of NH3 decomposition light-off on Ni-BCZY and 0.5Ru/1Ba/Ni-BCZY
  description:
  - 'One-dimensional packed-bed reactor simulation (negligible axial diffusion) with a mean-field surface
    mechanism on Ru and Ni sites, compared with the measured light-off curves at 500, 1000 and 3000 ppm
    NH3 in Ar, 1 bar, GHSV 50,000 h-1, ramp 2 K/min. Ni steps start from Zhu et al. (Int. J. Green Energy
    19 (2022) 1568), Ru steps from Zhang et al. (ACS Sustain. Chem. Eng. 7 (2019) 18038, Ba-promoted Ru
    on YSZ, coverage-dependent activation energies). Both parameter sets were re-optimized against the
    1000 ppm data and validated with the 500 and 3000 ppm data; the optimized set is article Table 4.
    Surface species: Ru, H-Ru, N-Ru, NH-Ru, NH2-Ru, NH3-Ru, Ni, H-Ni, N-Ni, NH-Ni, NH2-Ni, NH3-Ni.'
  software_package:
  - DETCHEM-PBR (DETCHEM package)
  - CaRMeN (Catalytic Reaction Mechanisms Network)
  - DETCHEM-ADJUST (thermodynamic consistency during optimization)
