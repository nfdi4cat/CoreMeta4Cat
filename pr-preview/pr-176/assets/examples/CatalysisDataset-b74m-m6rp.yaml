is_about_activity:
- id: coremeta4cat:REAC_b74m-m6rp_NH3_decomposition
  reaction_name:
  - thermocatalytic ammonia decomposition
  title:
  - NH3 decomposition light-off over Ru/Ni-BCZY and reference catalysts (6 catalysts, 3 inlet concentrations)
  description:
  - 'Thermocatalytic decomposition of ammonia (2 NH3 -> N2 + 3 H2) measured as light-off curves in a packed
    bed: NH3 in Ar at 1 bar, GHSV 50,000 h-1, temperature ramped from 473 to 873 K at 2 K/min, after 1.5
    h pretreatment at 873 K in 5% H2/Ar and 1 h Ar purge at 473 K. Six catalysts at 1000 ppm NH3 (Fig.
    2); 0.5Ru/1Ba/Ni-BCZY and Ni-BCZY also at 500 and 3000 ppm (Fig. 3 and simulation comparisons). Article
    Table 3 gives T10/T50: Ni-BCZY 656/717 K, 1Ru/Ni-BCZY 621/675 K, 0.5Ru/1Ba/Ni-BCZY 615/675 K, 0.5Ru/0.5Ba/Ni-BCZY
    621/676 K, 1Ru/1Ba/YSZ 536/589 K, 1Ru/1Ba/Ni-YSZ 621/688 K. The deposited curve for 0.5Ru/0.5Ba/Ni-BCZY
    is unreadable (lost decimal separators); its T10/T50 survive only in the article.'
