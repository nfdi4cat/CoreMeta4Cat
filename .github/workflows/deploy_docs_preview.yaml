# .github/workflows/deploy_docs_preview.yaml
#
# Deploy / remove documentation previews (step 2 of 2)
# =====================================================
# - When "Preview documentation build" (test_pages_build.yaml) succeeds for
#   a PR, publish its `docs-preview` artifact to gh-pages under
#   pr-preview/pr-<number>/ and, once GitHub Pages actually serves it,
#   comment the URL on the PR.
# - When a PR is closed, remove its preview again.
#
# Both push to gh-pages with .github/scripts/publish-preview.sh, which waits
# until GitHub Pages has finished publishing the previous push. Pushing while
# Pages is busy makes GitHub cancel that run and report a failed deployment.
#
# Security: this workflow has write access, so it must never check out or
# run code from a PR (https://securitylab.github.com/resources/
# github-actions-preventing-pwn-requests/). It only checks out branches of
# this repository (never the PR) and treats the artifact as untrusted data:
#   * the PR number in the artifact is only used after the GitHub API
#     confirms that this PR's head is exactly the commit that was built;
#   * a fork PR is only published if its author is an owner, member or
#     collaborator (TRUSTED_ASSOCIATIONS below), because previews are served
#     from the organisation's GitHub Pages domain. Other fork PRs get a
#     comment pointing to the artifact of the build run instead.
#
# workflow_run and pull_request_target always use the workflow file from
# the default branch, so changes to this file only take effect once they
# are merged to main.
---
name: Deploy documentation preview

on:  # yamllint disable-line rule:truthy
  workflow_run:
    # Must match `name:` in test_pages_build.yaml.
    workflows: ["Preview documentation build"]
    types: [completed]
  pull_request_target:
    types: [closed]
    # Same filter as test_pages_build.yaml: such PRs never get a preview.
    paths-ignore:
      - "docs/assets/coremeta4cat_vocabulary.xlsx"

# One deploy/remove at a time per PR branch.
concurrency:
  # yamllint disable-line rule:line-length
  group: docs-preview-${{ github.event.workflow_run.head_repository.full_name || github.event.pull_request.head.repo.full_name }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # Author associations whose fork PRs get a published preview. PRs from
  # branches of this repository are always published.
  TRUSTED_ASSOCIATIONS: "OWNER MEMBER COLLABORATOR"

jobs:
  deploy:
    name: Deploy preview
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read         # download the artifact; check GitHub Pages runs
      contents: write       # push the preview to gh-pages
      pages: read           # look up the URL of the GitHub Pages site
      pull-requests: write  # comment the preview URL on the PR
    steps:
      # Trusted code only: the scripts on the default branch of this
      # repository.
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts

      # https://github.com/actions/download-artifact
      - name: Download documentation preview
        uses: actions/download-artifact@v8
        with:
          name: docs-preview
          path: _preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILT_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          # The artifact was produced by PR code: validate before use.
          pr_number="$(head -c 20 _preview/pr_number 2>/dev/null \
            | tr -d '[:space:]' || true)"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::The artifact contains no valid PR number."
            exit 1
          fi

          if ! pr_info="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
            --jq '[.state, .head.sha, (.head.repo.full_name // "-"),
                   .author_association] | @tsv')"; then
            echo "::error::Could not look up PR #$pr_number."
            exit 1
          fi
          IFS=$'\t' read -r state head_sha head_repo association \
            <<< "$pr_info"

          result=deploy
          if [ "$state" != "open" ]; then
            result=skip
            echo "::notice::PR #$pr_number is $state; nothing to deploy."
          elif [ "$head_sha" != "$BUILT_SHA" ] \
            || [ "$head_repo" != "$BUILT_REPO" ]; then
            result=skip
            echo "::notice::PR #$pr_number no longer points at the built" \
              "commit ${BUILT_SHA:0:7}; the build of its current head" \
              "deploys the preview."
          elif [ "$head_repo" != "$GITHUB_REPOSITORY" ] \
            && [[ " $TRUSTED_ASSOCIATIONS " != *" $association "* ]]; then
            result=untrusted
            echo "::notice::Not publishing PR #$pr_number: fork PR by an" \
              "author with association $association."
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # Lets the next steps recognise when GitHub Pages serves this build.
      # The commit comes from the event, not from the (untrusted) artifact.
      - name: Mark the preview with the built commit
        if: steps.pr.outputs.result == 'deploy'
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          rm -f _preview/site/preview-build.txt
          echo "$BUILT_SHA" > _preview/site/preview-build.txt

      # Only this preview's folder (and the few files at the root).
      # https://github.com/actions/checkout
      - name: Check out gh-pages
        if: steps.pr.outputs.result == 'deploy'
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: _gh-pages
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: pr-preview/pr-${{ steps.pr.outputs.number }}

      - name: Deploy preview
        id: preview
        if: steps.pr.outputs.result == 'deploy'
        working-directory: _gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-preview.sh" \
            deploy "$PR_NUMBER" "$GITHUB_WORKSPACE/_preview/site"

          # (On HTTP errors `gh api` prints the error body to stdout.)
          if ! base="$(gh api "repos/$GITHUB_REPOSITORY/pages" \
              --jq .html_url 2>/dev/null)" || [[ "$base" != https://* ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            base="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "preview-url=${base%/}/pr-preview/pr-$PR_NUMBER/" \
            >> "$GITHUB_OUTPUT"

      # Pushing to gh-pages is not the end: GitHub Pages then rebuilds the
      # site (pages-build-deployment), which takes another minute or two.
      # Commenting before that sends people to a missing or half-updated
      # preview, so wait until the marker written above is served.
      - name: Wait until GitHub Pages serves the preview
        id: live
        if: steps.pr.outputs.result == 'deploy'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker="${PREVIEW_URL%/}/preview-build.txt"
          for attempt in $(seq 1 60); do
            served="$(curl -fsSL --max-time 10 \
              -H 'Cache-Control: no-cache' "$marker?attempt=$attempt" \
              2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$served" = "$BUILT_SHA" ]; then
              echo "The preview of ${BUILT_SHA:0:7} is live" \
                "(after about $(( (attempt - 1) * 10 )) s)."
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::GitHub Pages did not serve the preview of" \
            "${BUILT_SHA:0:7} within 10 minutes; commenting anyway."
          echo "live=false" >> "$GITHUB_OUTPUT"

      # Comment lines stay unwrapped: GitHub renders newlines as line breaks.
      # yamllint disable rule:line-length

      # All preview comments share the header `pr-preview` (also used by
      # pr-preview-action before), so the PR keeps a single comment.
      # https://github.com/marocchino/sticky-pull-request-comment
      - name: Comment preview URL
        if: steps.pr.outputs.result == 'deploy'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            :books: **Documentation preview:** ${{ steps.preview.outputs.preview-url }}

            Built from ${{ github.event.workflow_run.head_sha }} ([build run](${{ github.event.workflow_run.html_url }})). It is updated on every push and removed when this PR is closed. ${{ steps.live.outputs.live != 'true' && 'GitHub Pages had not served this version yet after 10 minutes, so it may still take a moment to appear.' || '' }}

      - name: Comment why there is no preview
        if: steps.pr.outputs.result == 'untrusted'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            :books: Documentation previews are published automatically only for PRs from members and collaborators of this repository.

            The built site of ${{ github.event.workflow_run.head_sha }} can be downloaded as the `docs-preview` artifact of the [build run](${{ github.event.workflow_run.html_url }}).

      # yamllint enable rule:line-length

  remove:
    name: Remove preview
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: read         # check GitHub Pages runs before pushing
      contents: write       # remove the preview from gh-pages
      pull-requests: write  # update the preview comment
    steps:
      # On pull_request_target this checks out the PR's base branch of this
      # repository, NOT the PR's code. Never change that.
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts

      # Only this preview's folder (and the few files at the root).
      - name: Check out gh-pages
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: _gh-pages
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: pr-preview/pr-${{ github.event.pull_request.number }}

      # Succeeds without a push when there is no preview (never built, or
      # closed before the build finished; a build finishing after the merge
      # is not deployed because the PR is closed by then).
      - name: Remove preview
        id: remove
        working-directory: _gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-preview.sh" \
            remove "$PR_NUMBER"

      # https://github.com/marocchino/sticky-pull-request-comment
      - name: Comment that the preview was removed
        if: steps.remove.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            :books: Documentation preview removed because this PR was closed.
