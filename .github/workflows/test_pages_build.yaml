# .github/workflows/test_pages_build.yaml
#
# Preview documentation build (step 1 of 2)
# ==========================================
# Builds the documentation of a pull request and uploads it as the
# `docs-preview` artifact. Publishing it is done by deploy_docs_preview.yaml,
# which is triggered when this workflow completes.
#
# This workflow runs the PR's code (just, mkdocs), so it only gets a
# read-only token. That is also all a PR from a fork can get, which is why
# it runs for every PR, forks included. The write access needed to push to
# gh-pages and to comment on the PR lives in deploy_docs_preview.yaml, which
# never executes PR code.
#
# deploy_docs_preview.yaml refers to this workflow by its `name:` below;
# keep both in sync when renaming it.
---
name: Preview documentation build

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    # The auto-PRs from update_excel.yaml only change the generated
    # workbook; they don't need a documentation preview.
    paths-ignore:
      - "docs/assets/coremeta4cat_vocabulary.xlsx"

env:
  CLICOLOR: 1

# One build per PR; a new push cancels the build of the previous commit.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read  # check out the PR
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/actions/setup-python
      - name: Set up Python 3
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.13

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: 3.13
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install dependencies
        run: uv sync --dev --no-progress

      - name: Build documentation
        run: |
          just gen-charts
          just gen-schema-docs
          just gen-doc
          uv run mkdocs build -d site

      # deploy_docs_preview.yaml can't see which PR a fork's run belongs to,
      # so the number travels with the artifact. It is verified there before
      # it is used.
      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr_number

      # https://github.com/actions/upload-artifact
      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: |
            site/
            pr_number
          if-no-files-found: error
          retention-days: 7
