# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    # Inbox-only PRs are handled exclusively by excel_inbox.yaml.
    # This workflow fires after the excel_inbox bot-commit (which removes the
    # inbox file and adds schema changes), so the test matrix runs on the
    # correct, already-validated schema — satisfying branch-protection checks.
    #
    # PRs that only change the generated workbook (the auto-PRs of
    # update_excel.yaml) are skipped too: GitHub holds runs for PRs opened with
    # GITHUB_TOKEN until someone approves them, and auto-merge merges these
    # PRs within seconds, so such a run could only ever expire as "failed".
    # The schema behind the workbook was already tested on main.
    paths-ignore:
      - "inbox/**"
      - "docs/assets/coremeta4cat_vocabulary.xlsx"

env:
  FORCE_COLOR: "1"  # Make tools pretty.

permissions: {}

jobs:
  python-matrix:
    name: Generate Python version matrix
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      versions: ${{ steps.python.outputs.versions }}
      latest: ${{ steps.python.outputs.latest }}

    steps:
      # No `ref: main`: read pyproject.toml from the commit under test, so a
      # PR that changes requires-python is tested against its own matrix.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Pin the interpreter for this script (tomllib needs >= 3.11) instead
      # of relying on whatever Python the runner image ships.
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python -m pip install packaging

      - name: Extract supported Python versions
        id: python
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.request
          from pathlib import Path

          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          # Same manifest actions/setup-python installs from, so the matrix
          # only contains versions that exist and can be installed.
          MANIFEST_URL = (
              "https://raw.githubusercontent.com/actions/python-versions/"
              "main/versions-manifest.json"
          )

          with Path("pyproject.toml").open("rb") as f:
              requires_python = SpecifierSet(
                  tomllib.load(f)["project"]["requires-python"]
              )

          with urllib.request.urlopen(MANIFEST_URL, timeout=30) as response:
              manifest = json.load(response)

          # Group stable Linux CPython 3.x releases by minor version.
          releases: dict[tuple[int, int], list[Version]] = {}
          for entry in manifest:
              if not entry["stable"]:
                  continue
              if not any(f["platform"] == "linux" for f in entry["files"]):
                  continue
              version = Version(entry["version"])
              if version.major == 3:
                  key = (version.major, version.minor)
                  releases.setdefault(key, []).append(version)

          # A minor version counts as supported if any released patch
          # satisfies requires-python (">=3.10.4" still keeps 3.10).
          versions = [
              f"{major}.{minor}"
              for (major, minor), patches in sorted(releases.items())
              if any(patch in requires_python for patch in patches)
          ]

          if not versions:
              raise SystemExit(
                  "No released Python versions satisfy "
                  f"requires-python {requires_python}"
              )

          print(f"requires-python {requires_python} -> {versions}")

          # The heredoc is quoted ('PY'), so the shell does not expand
          # $GITHUB_OUTPUT here -- read it from the environment instead.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"versions={json.dumps(versions)}\n")
              out.write(f"latest={versions[-1]}\n")
          PY

  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read  # needed alongside actions/upload-artifact below

    needs: python-matrix

    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Regenerate Excel vocabulary from schema
        # Keeps docs/assets/coremeta4cat_vocabulary.xlsx up to date
        # before any documentation build step uses it.
        run: just schema-to-excel

      - name: Run test suite
        run: just test

      # examples/output/ (json + yaml + ttl) is generated by `just test`
      # (linkml-run-examples) and is tracked in the repo -- archive it from
      # one matrix leg too, so a specific run's output is inspectable as a
      # build artifact without needing a local checkout or waiting on the
      # next commit.
      - name: Upload example validation output
        # Newest supported version, so this never silently stops running
        # when a hardcoded version drops out of requires-python.
        if: matrix.python-version == needs.python-matrix.outputs.latest
        uses: actions/upload-artifact@v7
        with:
          name: example-outputs
          path: examples/output/
          retention-days: 30
