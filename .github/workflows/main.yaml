# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    # Inbox-only PRs are handled exclusively by excel_inbox.yaml.
    # This workflow fires after the excel_inbox bot-commit (which removes the
    # inbox file and adds schema changes), so the test matrix runs on the
    # correct, already-validated schema — satisfying branch-protection checks.
    paths-ignore:
      - "inbox/**"

env:
  FORCE_COLOR: "1" # Make tools pretty.

permissions: {}

jobs:
  python-matrix:
    name: Generate Python version matrix
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      versions: ${{ steps.python.outputs.versions }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install packaging
        run: python -m pip install packaging

      - name: Extract supported Python versions
        id: python
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          with Path("pyproject.toml").open("rb") as f:
              pyproject = tomllib.load(f)

          requires_python = pyproject["project"]["requires-python"]

          candidates = [
              Version(f"3.{minor}")
              for minor in range(8, 20)
          ]

          versions = [
              str(version)
              for version in candidates
              if version in SpecifierSet(requires_python)
          ]

          if not versions:
              raise SystemExit(
                  f"No supported Python versions found for {requires_python}"
              )

          print(f"Supported Python versions: {versions}")

          with open("$GITHUB_OUTPUT", "a") as output:
              output.write(f"versions={json.dumps(versions)}\n")
          PY

  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read  # needed alongside actions/upload-artifact below
      
    needs: python-matrix

    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Regenerate Excel vocabulary from schema
        # Keeps docs/assets/coremeta4cat_vocabulary.xlsx up to date
        # before any documentation build step uses it.
        run: just schema-to-excel

      - name: Run test suite
        run: just test

      # examples/output/ (json + yaml + ttl) is generated by `just test`
      # (linkml-run-examples) and is tracked in the repo -- archive it from
      # one matrix leg too, so a specific run's output is inspectable as a
      # build artifact without needing a local checkout or waiting on the
      # next commit.
      - name: Upload example validation output
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: example-outputs
          path: examples/output/
          retention-days: 30
