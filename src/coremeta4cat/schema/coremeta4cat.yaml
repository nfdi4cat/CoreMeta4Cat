version: 1.0.0

prefixes:
  coremeta4cat: https://w3id.org/nfdi4cat/coremeta4cat/
  voc4cat: https://w3id.org/nfdi4cat/voc4cat_
  chemdcatap: https://w3id.org/nfdi-de/dcat-ap-plus/chemistry/
  dcatap_plus: https://w3id.org/nfdi-de/dcat-ap-plus/
  linkml: https://w3id.org/linkml/
  dcat: http://www.w3.org/ns/dcat#
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  IAO: http://purl.obolibrary.org/obo/IAO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  SIO: http://semanticscience.org/resource/SIO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  CHMO: http://purl.obolibrary.org/obo/CHMO_
  enm: http://purl.enanomapper.org/onto/
  panet: http://purl.org/pan-science/PaNET/
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  RO: http://purl.obolibrary.org/obo/RO_
  RXNO: http://purl.obolibrary.org/obo/RXNO_
  PROCO: http://purl.obolibrary.org/obo/PROCO_
  REX: http://purl.obolibrary.org/obo/REX_
  qudt: http://qudt.org/schema/qudt/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  foaf: http://xmlns.com/foaf/0.1/
  adms: http://www.w3.org/ns/adms#
  hdl: https://hdl.handle.net/
  # Declared here even where a module declares them too. SchemaView caches its
  # prefix map while it resolves the DCAT-AP-PLUS import, before DCAT-AP-PLUS and
  # the reaction, characterization and synthesis modules are loaded. A prefix
  # declared only there is written unexpanded into RDF, e.g.
  # <allotrope.quality:0001159>. tests/test_rdf_output.py checks every CURIE.
  allotrope.result: http://purl.allotrope.org/ontologies/result#AFR_
  allotrope.process: http://purl.allotrope.org/ontologies/process#AFP_
  allotrope.quality: http://purl.allotrope.org/ontologies/quality#AFQ_
  allotrope.role: http://purl.allotrope.org/ontologies/role#AFRL_
  COB: http://purl.obolibrary.org/obo/COB_
  dcatap: http://data.europa.eu/r5r/
  eli: http://data.europa.eu/eli/ontology#
  locn: http://www.w3.org/ns/locn#
  odrl: http://www.w3.org/ns/odrl/2/
  spdx: http://spdx.org/rdf/terms#

default_prefix: coremeta4cat
default_range: string

imports:
- linkml:types
- coremeta4cat_common
- coremeta4cat_synthesis_ap
- coremeta4cat_characterization_ap
- coremeta4cat_reaction_ap
- coremeta4cat_simulation_ap

# ==================== ENTRY POINT: CATALYSIS DATASET ====================

classes:

  CatalysisDataset:
    is_a: Dataset
    class_uri: dcat:Dataset
    mixins:
    - ClassifierMixin
    description: |-
      A dcat:Dataset that contains research data in the field of catalysis.

      The catalysis research field is expressed via rdf_type using voc4cat
      terms from CatalysisResearchFieldEnum (following DCAT-AP-PLUS Pattern 3).
      For example, a dataset from heterogeneous catalysis research would carry:
        rdf_type:
          - id: voc4cat:0007001
            title: "heterogeneous catalysis"
      Interdisciplinary work lists every field that applies, e.g. biocatalysis
      and electrocatalysis for bioelectrocatalysis.

      The four CoreMeta4Cat minimum information pillars are linked via the slots
      below, each pointing to the corresponding DataGeneratingActivity or
      EvaluatedActivity subclass defined in the CoreMeta4Cat subprofile modules.
      Synthesis, Characterization and Simulation are each described in their
      own slot (was_generated_by_synthesis, was_generated_by_characterization,
      was_generated_by_simulation); was_generated_by lists the ids of all of
      them.
    slots:
    - was_generated_by_synthesis
    - was_generated_by_characterization
    - was_generated_by_simulation
    slot_usage:
      rdf_type:
        description: |-
          The catalysis research field(s), provided as voc4cat terms from
          CatalysisResearchFieldEnum. This is the primary machine-actionable
          classification of the dataset's domain (Layer 1) and is mandatory.
          Several fields can be given for interdisciplinary work, e.g.
          biocatalysis and electrocatalysis for bioelectrocatalysis.
        required: true
        multivalued: true
        inlined_as_list: true
        bindings:
        - binds_value_of: id
          range: CatalysisResearchFieldEnum
          obligation_level: REQUIRED
          description: Classify the dataset by catalysis research field(s) using voc4cat.
      was_generated_by:
        description: |-
          The ids of all activities that produced this dataset's data, e.g.
          [coremeta4cat:SYN_1, coremeta4cat:CHAR_1]. Describe each activity in
          full in was_generated_by_synthesis, was_generated_by_characterization
          or was_generated_by_simulation, under the same id. DCAT-AP-PLUS
          requires this slot on every Dataset; in RDF both lists become the
          same prov:wasGeneratedBy links.
        range: DataGeneratingActivity
        required: true
        multivalued: true
        inlined: false
        inlined_as_list: false
      is_about_activity:
        description: |-
          The catalytic Reaction that this dataset is about (e.g. a dataset of
          catalytic performance measurements is about the Reaction being studied).
        range: CatalyticReaction
        recommended: true
        multivalued: true
        inlined_as_list: true
      is_about_entity:
        description: |-
          The catalyst sample, material, or other Entity that this dataset is about.
        range: EvaluatedEntity
        recommended: true
        multivalued: true
        inlined_as_list: true
slots:
  # ---- The data-generating pillars of a CatalysisDataset ----
  # One slot per activity class instead of one polymorphic was_generated_by:
  # the range tells software which class an entry is, so no type designator is
  # needed, and in RDF each entry is typed with its class_uri automatically.
  # was_generated_by (required by DCAT-AP-PLUS) lists the ids of all of them.
  was_generated_by_synthesis:
    is_a: was_generated_by
    slot_uri: prov:wasGeneratedBy
    range: Synthesis
    multivalued: true
    inlined_as_list: true
    description: |-
      The Synthesis activities (catalyst preparations) that produced data in
      this dataset, each described in full. List their ids in was_generated_by
      as well. In RDF: prov:wasGeneratedBy, with the activity typed
      PROCO:0000001 (synthetic chemical process).
  was_generated_by_characterization:
    is_a: was_generated_by
    slot_uri: prov:wasGeneratedBy
    range: Characterization
    multivalued: true
    inlined_as_list: true
    description: |-
      The Characterization activities (measurements of a catalyst, material or
      reaction) that produced data in this dataset, each described in full.
      List their ids in was_generated_by as well. In RDF: prov:wasGeneratedBy,
      with the activity typed OBI:0000070 (assay).
  was_generated_by_simulation:
    is_a: was_generated_by
    slot_uri: prov:wasGeneratedBy
    range: Simulation
    multivalued: true
    inlined_as_list: true
    description: |-
      The Simulation activities (computational studies) that produced data in
      this dataset, each described in full. List their ids in was_generated_by
      as well. In RDF: prov:wasGeneratedBy, with the activity typed
      PROCO:0000159 (in-silico modeling).
  adsorbate:
    description: Chemical identity of the adsorbed species (e.g. "CO", "OH", "CH3", "N2H"). Use a chemical formula or SMILES.
    range: string
    slot_uri: coremeta4cat:adsorbate
    recommended: true
    multivalued: true
  adsorption_site:
    description: Adsorption site of the adsorbate (e.g. top, bridge, fcc hollow, hcp hollow, step edge, oxygen vacancy, single-atom site).
    range: string
    slot_uri: coremeta4cat:adsorption_site
    recommended: true
    multivalued: true
  adsorption_energy:
    description: Adsorption energy, E_ads = E(slab+adsorbate) - E(slab) - E(reference species). Negative values indicate exothermic binding.
    range: float
    slot_uri: coremeta4cat:adsorption_energy
    recommended: true
    multivalued: true
    unit:
      ucum_code: eV
  energy_reference:
    description: Reference species and states used to compute relative energies (e.g. "CO(g)", "1/2 H2(g)", "H2O(g) and H2(g)").
    range: string
    slot_uri: coremeta4cat:energy_reference
    recommended: true
    multivalued: true
  energy_correction_type:
    description: 'Level at which the reported energies are given: electronic energy (Delta_E), zero-point-energy corrected, enthalpy, or Gibbs free energy (Delta_G). For free energies, state the temperature and pressures used.'
    range: string
    slot_uri: coremeta4cat:energy_correction_type
    multivalued: true
  zero_point_energy_correction:
    description: Zero-point energy correction applied to the reported energy.
    range: float
    slot_uri: coremeta4cat:zero_point_energy_correction
    multivalued: true
    unit:
      ucum_code: eV
  elementary_step:
    description: Elementary reaction step written as an equation, with * denoting a free surface site (e.g. "CO* + O* -> CO2(g) + 2*").
    range: string
    slot_uri: coremeta4cat:elementary_step
    recommended: true
    multivalued: true
  initial_state:
    description: Description of the initial-state configuration of the elementary step.
    range: string
    slot_uri: coremeta4cat:initial_state
    multivalued: true
  final_state:
    description: Description of the final-state configuration of the elementary step.
    range: string
    slot_uri: coremeta4cat:final_state
    multivalued: true
  reaction_energy:
    description: Reaction energy of the elementary step, Delta_E = E(final state) - E(initial state).
    range: float
    slot_uri: coremeta4cat:reaction_energy
    recommended: true
    multivalued: true
    unit:
      ucum_code: eV
  reaction_free_energy:
    description: Gibbs free energy change of the elementary step, Delta_G, including ZPE, enthalpic and entropic corrections at the stated temperature and pressures.
    range: float
    slot_uri: coremeta4cat:reaction_free_energy
    multivalued: true
    unit:
      ucum_code: eV
  free_energy_temperature:
    description: Temperature at which free energy corrections were evaluated.
    range: float
    slot_uri: coremeta4cat:free_energy_temperature
    multivalued: true
    unit:
      ucum_code: K
  forward_activation_energy:
    description: Activation energy of the forward step, E_a = E(transition state) - E(initial state).
    range: float
    slot_uri: coremeta4cat:forward_activation_energy
    recommended: true
    multivalued: true
    unit:
      ucum_code: eV
  reverse_activation_energy:
    description: Activation energy of the reverse step, E(transition state) - E(final state).
    range: float
    slot_uri: coremeta4cat:reverse_activation_energy
    multivalued: true
    unit:
      ucum_code: eV
  ts_search_method:
    description: Method used to locate the transition state (e.g. NEB, CI-NEB, dimer method, growing string method, constrained optimisation).
    range: string
    slot_uri: coremeta4cat:ts_search_method
    recommended: true
    multivalued: true
  number_of_images:
    description: Number of intermediate images used in a NEB or string calculation.
    range: integer
    slot_uri: coremeta4cat:number_of_images
    multivalued: true
  imaginary_frequency:
    description: Imaginary vibrational frequency associated with the reaction coordinate at the transition state.
    range: float
    slot_uri: coremeta4cat:imaginary_frequency
    multivalued: true
    unit:
      ucum_code: cm-1
  ts_verification_method:
    description: Method used to verify the transition state (e.g. vibrational analysis showing a single imaginary mode, intrinsic reaction coordinate (IRC)).
    range: string
    slot_uri: coremeta4cat:ts_verification_method
    multivalued: true
  electrode_potential_model:
    description: Model used to treat the electrode potential (e.g. computational hydrogen electrode, constant-potential / grand-canonical DFT).
    range: string
    slot_uri: coremeta4cat:electrode_potential_model
    recommended: true
    multivalued: true
  potential_reference_scale:
    description: Reference scale of the reported potentials (e.g. RHE, SHE).
    range: string
    slot_uri: coremeta4cat:potential_reference_scale
    multivalued: true
  applied_potential:
    description: Electrode potential at which free energies were evaluated.
    range: float
    slot_uri: coremeta4cat:applied_potential
    multivalued: true
    unit:
      ucum_code: V
  limiting_potential:
    description: Highest (least negative) potential at which all electrochemical steps are exergonic.
    range: float
    slot_uri: coremeta4cat:limiting_potential
    recommended: true
    multivalued: true
    unit:
      ucum_code: V
  theoretical_overpotential:
    description: Difference between the equilibrium potential of the reaction and the limiting potential.
    range: float
    slot_uri: coremeta4cat:theoretical_overpotential
    multivalued: true
    unit:
      ucum_code: V
  potential_determining_step:
    description: Elementary step that determines the limiting potential.
    range: string
    slot_uri: coremeta4cat:potential_determining_step
    multivalued: true
  descriptor_type:
    description: Type of activity descriptor (e.g. d-band centre, adsorption energy of a key intermediate, generalised coordination number, O p-band centre).
    range: string
    slot_uri: coremeta4cat:descriptor_type
    recommended: true
    multivalued: true
  descriptor_value:
    description: Value of the descriptor; state the unit together with the descriptor type.
    range: float
    slot_uri: coremeta4cat:descriptor_value
    recommended: true
    multivalued: true
  d_band_center:
    description: Centre of the d-band projected density of states, relative to the Fermi level.
    range: float
    slot_uri: coremeta4cat:d_band_center
    multivalued: true
    unit:
      ucum_code: eV
  scaling_relation:
    description: Linear scaling relation between adsorption energies (e.g. "Delta_E_OH = 0.50 Delta_E_O + 0.10 eV").
    range: string
    slot_uri: coremeta4cat:scaling_relation
    multivalued: true
  bep_relation:
    description: Brønsted–Evans–Polanyi relation between activation energies and reaction energies (slope and intercept).
    range: string
    slot_uri: coremeta4cat:bep_relation
    multivalued: true
