id: https://w3id.org/nfdi4cat/coremeta4cat
name: coremeta4cat-metadata
title: CoreMeta4cat Metadata Reference Model
description: |-
  The CoreMeta4Cat describes the minimum information which must be reported with research
  data concerning the field of catalysis. This guideline helps to handle and
  standardize data based on the FAIR principle (Findable, Accessible, Interoperable,
  Reusable).

  Architecture
  ------------
  CoreMeta4Cat follows the DCAT-AP-PLUS design patterns (see design-patterns.md):

  - The entry point is the dcat:Dataset, extended here as CatalysisDataset.
    The catalysis research field is expressed via rdf_type (ClassifierMixin,
    Pattern 3) using voc4cat terms — analogous to how NMRSpectroscopy uses
    rdf_type: CHMO:0000613 to classify the measurement type.

  - The four CoreMeta4Cat pillars are modelled as DCAT-AP-PLUS Activity subclasses,
    following the same pattern as NMRSpectroscopy (is_a: DataGeneratingActivity).
    Each pillar has an ontology term as its class_uri, as chem-dcat-ap does for
    SubstanceSample (SIO:001378) or ChemicalEntity (CHEBI:23367), so the RDF of
    every activity says what kind of activity it is.

    CatalysisDataset describes the three data-generating pillars in one slot
    each: was_generated_by_synthesis, was_generated_by_characterization and
    was_generated_by_simulation. All three are prov:wasGeneratedBy in RDF, and
    the range of each slot tells software which class its entries are, so no
    type designator is needed. was_generated_by itself, which DCAT-AP-PLUS
    requires on every Dataset, lists the ids of all these activities.
    is_about_activity is typed CatalyticReaction directly (not the wider
    EvaluatedActivity), so it needs no designator either:

      Synthesis      --> is_a: DataGeneratingActivity, class_uri PROCO:0000001
                       Produces a catalyst (MaterialSample) as had_output_entity.
                       The PreparationMethod (protocol) is linked via realized_plan.

      Characterization --> is_a: DataGeneratingActivity, class_uri OBI:0000070
                         Produces measurement data about a catalyst or reaction.
                         The catalyst/sample is the evaluated_entity.
                         The CharacterizationTechnique is linked via realized_plan.

      Reaction       --> CatalyticReaction (is_a: ChemicalReaction, EvaluatedActivity),
                       class_uri REX:0000051
                       The catalytic process being studied, NOT a data-generating
                       activity itself. Characterization datasets are about this.
                       Analogous to the reaction being observed in a reaction
                       monitoring dataset.

      Simulation     --> is_a: DataGeneratingActivity, class_uri PROCO:0000159
                       Generates computational data about a catalyst or reaction.
                       The SimulationMethod (protocol) is linked via realized_plan.
                       The simulation software is carried_out_by: Software.

  - Catalyst samples and precursor materials are modelled as MaterialSample
    (from material_entities_ap), which is an EvaluatedEntity.

  - Reactors and instruments are modelled as Device (from dcat_ap_plus), which
    is an AgenticEntity carried_out_by the relevant Activity.

  - PreparationMethod, CharacterizationTechnique, and SimulationMethod are
    modelled as Plan (from dcat_ap_plus), the protocol realized by the Activity.

  This file is the top-level aggregator. It imports coremeta4cat_common (shared
  slots and enums) and the four subprofile modules.

  Full import hierarchy:
  ```
    coremeta4cat.yaml  (this file — aggregator + CatalysisDataset entry point)
      +-- coremeta4cat_common.yaml         (shared slots, enums)
            +-- chem_dcat_ap          (SubstanceSample, ChemicalSubstance, …)
                  +-- chemical_reaction_ap
                        +-- chemical_entities_ap
                              +-- material_entities_ap
                                    +-- dcat_ap_plus  (DCAT-AP-PLUS base)
      +-- coremeta4cat_synthesis_ap         (Step 3 — Synthesis, PreparationMethod, mixins)
      +-- coremeta4cat_characterization_ap  (Step 4 — Characterization, 24 techniques, mixins)
      +-- coremeta4cat_reaction_ap          (Step 5 — Reaction, 8 Reactor subclasses)
      +-- coremeta4cat_simulation_ap        (Step 6 — Simulation, 4 methods, 12 properties, mixins)
  ```

