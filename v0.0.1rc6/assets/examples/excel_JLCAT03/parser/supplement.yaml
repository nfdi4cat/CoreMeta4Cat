# Supplement: everything the record needs that is NOT in the workbook.
#
# Read by xlsx_to_coremeta4cat.py together with crosswalk.yaml. Each entry says where its value
# comes from (`source`), why it is needed (`why`), and its `basis`:
#   provider     given by the data provider in their answers (source/provider_answers.md, Q1-Q17)
#   curator      minted or chosen by the curator (ids, ontology terms); the reason is in `why`
#   placeholder  a required field the source does not give; it states the absence instead of
#                inventing a value (--no-placeholders leaves these out)
# An entry with `as:` is converted like a workbook cell (same conversions and units as in the
# crosswalk). `open_questions` are listed in parse_report.md next to the crosswalk's flags.

dataset:
  - to: id
    value: "coremeta4cat:DS_excel_JLCAT03"
    source: curator
    why: >-
      Required. The dataset has no persistent identifier yet; minted from the catalyst ID, following
      the coremeta4cat:DS_... pattern of the other example datasets without a PID.
  - to: "title[]"
    value: "Supported Pt catalyst for the epoxidation of styrene"
    basis: provider
    source: data provider's answers, Q17
    why: Required.
  - to: "description[]"
    value: >-
      Alumina supported Pt catalyst was synthesized with incipient wetness impregnation and applied
      in the liquid phase epoxidation reaction of styrene.
    basis: provider
    source: data provider's answers, Q17
    why: Required.
  - to: "keyword[]"
    value: epoxidation
    basis: provider
    source: data provider's answers, Q17
    why: Recommended by DCAT.
  - to: "keyword[]"
    value: supported catalyst
    basis: provider
    source: data provider's answers, Q17
    why: Recommended by DCAT.
  - to: "keyword[]"
    value: styrene oxide
    basis: provider
    source: data provider's answers, Q17
    why: Recommended by DCAT.
  - to: "qualified_attribution[]"
    value: {title: contact person, description: Arjun Neyyathala}
    basis: provider
    source: data provider's answers, Q17
    why: >-
      Named by the data provider as contact person. contact_point (vcard:Kind) has no properties in
      DCAT-AP-PLUS, and Attribution has only a title and a description, so role and name are text.

records:
  Synthesis:
    - to: "catalyst_measured_properties[]"
      value: "Phase seen in PXRD is Pt"
      basis: provider
      source: data provider's answers, Q2
      why: Required by Synthesis. Quoted as given.
    - to: realized_plan.has_drying_duration
      as: quantity
      value: 12
      unit: HR
      kind: Time
      basis: provider
      source: data provider's answers, Q6
      why: >-
        The workbook says 'over night' (Synthesis!T3, kept in the plan description); the data
        provider gave 12 hours.
    - to: "has_part[reduction].title[]"
      value: "reduction in 5 % H2/N2"
      basis: provider
      source: data provider's answers, Q10, and Synthesis!W3 (atmosphere)
      why: >-
        Names the step recorded in the calcination columns (W-AB), which the data provider says
        was a reduction.
    - to: "has_part[reduction].description[]"
      value: >-
        Thermal treatment after drying, recorded in the calcination columns of the workbook
        (Synthesis!W3-AB3). According to the data provider it was a reduction only; no
        calcination in air took place.
      basis: provider
      source: data provider's answers, Q10
      why: Explains why the calcination columns are recorded as a reduction step.
    - to: "has_part[reduction].rdf_type"
      value: {id: "voc4cat:0000098", title: reduction}
      source: curator, following the data provider's answer Q10
      why: >-
        voc4cat:0000098 'reduction' (gain of electrons or decrease in oxidation state), checked in
        voc4cat v2026-10-31. voc4cat has no concept for a catalyst reduction step as such.
    - to: "has_part[reduction].has_quantitative_attribute[]"
      as: quantity
      value: 25
      unit: DEG_C
      kind: Temperature
      attrs: {title: starting temperature, description: room temperature}
      basis: provider
      source: data provider's answers, Q11
      why: Start of the temperature programme; the final temperature is Synthesis!AB3.
  Character:
    - to: "carried_out_by[instrument]"
      value: {id: "coremeta4cat:DEV_Stoe-STADI-MP", title: Stoe STADI-MP diffractometer}
      basis: provider
      source: data provider's answers, Q1
      why: Required by Characterization. The id is minted from the instrument name.
    - to: "detector_type[]"
      value: dectris mythen 1K
      basis: provider
      source: data provider's answers, Q15
      why: Recommended by Characterization. Quoted as given.
    - to: "realized_plan.has_temperature[]"
      as: quantity
      value: 25
      unit: DEG_C
      kind: Temperature
      attrs: {description: room temperature}
      basis: provider
      source: data provider's answers, Q15
      why: Measurement temperature, recommended by PowderXRD.
    - to: realized_plan.description
      value: Step size in degrees 2theta (unit given by the data provider; the step_size slot holds a bare number).
      basis: provider
      source: data provider's answers, Q3
      why: step_size cannot carry a unit, so the unit is stated in the protocol's description.
  Reaction:
    - to: "used_reactant[oxygen]"
      value:
        title: oxygen
        description: listed as reactant by the data provider; also the atmosphere of the test (Reaction!G3)
      basis: provider
      source: data provider's answers, Q13
      why: Recommended by CatalyticReaction (used_reactant).
    - to: "used_reactor[reactor].reaction_chamber_material[]"
      value: stainless steel
      basis: provider
      source: data provider's answers, Q16
      why: Recommended by Autoclave.
    - to: "used_reactor[reactor].vessel_material[]"
      value: stainless steel
      basis: provider
      source: data provider's answers, Q16
      why: Recommended by Autoclave.
    - to: used_reactor[reactor].batch_duration
      as: quantity
      value: 12
      unit: HR
      kind: Time
      basis: provider
      source: data provider's answers, Q16
      why: Recommended by Autoclave.

open_questions:
  - about: Dataset (Q17)
    text: No licence was given. Under which licence may the example be published (e.g. CC BY 4.0)?
  - about: Dataset (Q17)
    text: >-
      No authors were given, only a contact person. Who should be named as creators (with ORCID)?
  - about: Synthesis!Z3 (Q7)
    text: >-
      The reference conditions are given as "NTP", which is defined in more than one way: NIST
      uses 20 degC and 1 atm, while the German normal litre (DIN 1343) refers to 0 degC and
      1.01325 bar. Which temperature and pressure apply?
