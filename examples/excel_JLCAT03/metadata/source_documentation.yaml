# ============================================================
# SOURCE DOCUMENTATION (generated by parser/xlsx_to_coremeta4cat.py, do not edit)
# Provenance of every value in CatalysisDataset-JLCAT03.yaml
# ============================================================
#
# FORMAT
#   target: where the value sits in the record (ids without the coremeta4cat: prefix)
#   value:  what was written
#   source: workbook cell [sheet!cell, header or row label, term] or supplement entry
#   basis:  direct | deduced | schema-forced | fallback (crosswalk) ; curator | placeholder (supplement)
#   note:   why this target, plus where the unit came from
# ============================================================

entries:
- target: (dataset).id
  value: coremeta4cat:DS_excel_JLCAT03
  source: 'supplement: curator'
  basis: curator
  note: Required. The dataset has no persistent identifier yet; minted from the catalyst ID, following
    the coremeta4cat:DS_... pattern of the other example datasets without a PID.
- target: (dataset).title
  value: 'Pt/Al2O3 catalyst JLCAT03: incipient wetness impregnation, powder XRD and styrene epoxidation'
  source: 'supplement: curator'
  basis: curator
  note: Required. Not given by the data provider; composed only from workbook values (Synthesis!C3, B3,
    Q3; Character!C8; Reaction!K3, E3).
- target: (dataset).description
  value: The example involves the synthesis of an alumina-supported Pt catalyst via incipient wetness
    impregnation, its characterization using powder X-ray diffraction (PXRD), and its subsequent application
    in the epoxidation of styrene in an autoclave under an O₂ atmosphere.
  source: 'supplement: data provider''s accompanying text (source/provider_note.md), verbatim'
  basis: curator
  note: Required.
- target: was_generated_by[SYN_JLCAT03].had_output_entity[CAT_JLCAT03].other_identifier
  value:
    notation: JLCAT03
    description: catalyst identifier (voc4cat:0008134) assigned in the source workbook
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!B3, 'catalyst ID voc4cat:0008134']
  basis: schema-forced
  note: voc4cat:0008134 is 'catalyst identifier'. The schema has no slot with this term; the lab identifier
    of the catalyst produced in this row is kept as other_identifier of the CatalystSample, and it is
    the join key to the Character and Reaction sheets (Character!C1, Reaction!N3 carry the same value).
- target: is_about_entity[CAT_JLCAT03]
  value: coremeta4cat:CAT_JLCAT03
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!B3, 'catalyst ID voc4cat:0008134']
  basis: deduced
  note: All three sheets describe this catalyst (same catalyst ID), so the dataset is about it.
- target: was_generated_by[SYN_JLCAT03].nominal_composition
  value: Pt/Al2O3 (5 wt.%)
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!C3, 'nominal composition']
  basis: direct
  note: Header is the slot name nominal_composition (Synthesis).
- target: was_generated_by[SYN_JLCAT03].had_output_entity[CAT_JLCAT03].title
  value: Pt/Al2O3 (5 wt.%)
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!C3, 'nominal composition']
  basis: deduced
  note: The nominal composition in this row describes the catalyst produced in this row; used as its display
    title.
- target: is_about_entity[CAT_JLCAT03].title
  value: Pt/Al2O3 (5 wt.%)
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!C3, 'nominal composition']
  basis: deduced
  note: The nominal composition in this row describes the catalyst produced in this row; used as its display
    title.
- target: was_generated_by[SYN_JLCAT03].had_output_entity[CAT_JLCAT03].has_quantitative_attribute
  value:
    value: 5
    unit: https://qudt.org/vocab/unit/PERCENT
    has_quantity_type: http://qudt.org/vocab/quantitykind/MassFraction
    title: metal loading
    rdf_type:
      id: voc4cat:0008106
      title: metal loading
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!D3, 'metal loading voc4cat:0008106']
  basis: schema-forced
  note: 'voc4cat:0008106 ''metal loading'' is defined as the weight percentage of active metal relative
    to the total supported-catalyst mass, i.e. a property of the catalyst. The schema has no metal-loading
    slot, so it is a generic QuantitativeAttribute of the CatalystSample, typed with the voc4cat term
    via rdf_type. unit from the unit row: ''wt.%'' -> PERCENT'
- target: was_generated_by[SYN_JLCAT03].storage_conditions
  value: ambient
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!E3, 'storage conditions (voc4cat:0008105)']
  basis: direct
  note: voc4cat:0008105 is the slot_uri of storage_conditions (Synthesis).
- target: was_generated_by[SYN_JLCAT03].catalyst_support
  value: Al2O3
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!F3, 'catalyst support VOC4CAT:0008104']
  basis: direct
  note: voc4cat:0008104 is the slot_uri of catalyst_support (Synthesis).
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_support].title
  value: Al2O3
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!F3, 'catalyst support VOC4CAT:0008104']
  basis: deduced
  note: The support has its own quantity (column H) and InChI (column G), so it is an input material of
    the impregnation. catalyst_support is a plain string slot and cannot hold either; had_input_entity
    is the only slot for input materials (see column H).
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_support].has_qualitative_attribute
  value:
    value: InChI=1S/2Al.3O/q2*+3;3*-2
    title: InChI
    rdf_type:
      id: CHEMINF:000113
      title: InChI descriptor
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!G3, 'support Inchi']
  basis: schema-forced
  note: Precursor (a MaterialSample) has no inchi slot; the InChI is attached as a generic QualitativeAttribute
    typed CHEMINF:000113, the class_uri of the schema's InChi class.
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_support].precursor_quantity
  value:
    value: 957.9
    unit: https://qudt.org/vocab/unit/MilliGM
    has_quantity_type: http://qudt.org/vocab/quantitykind/Mass
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!H3, 'catalyst support quantity']
  basis: schema-forced
  note: 'The schema has no slot for the amount of support. Synthesis.had_input_entity accepts only Precursor,
    whose precursor_quantity is a Mass, so the support is listed as an input entity of class Precursor.
    voc4cat defines precursor as a starting material transformed during the synthesis of a catalyst, which
    covers an impregnated support. unit from the unit row: ''mg'' -> MilliGM'
- target: was_generated_by[SYN_JLCAT03].solvent[CHEM_water].title
  value: water
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!I3, 'Solvent VOC4CAT:0007246']
  basis: direct
  note: voc4cat:0007246 is the slot_uri of solvent (Synthesis; range ChemicalEntity).
- target: was_generated_by[SYN_JLCAT03].solvent[CHEM_water].inchi
  value:
    value: InChI=1S/H2O/h1H2
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!J3, 'solvent Inchi']
  basis: direct
  note: ChemicalEntity has an inchi slot (range InChi).
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_1].title
  value: Pt(NH3)4(NO3)2
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!K3, 'Precursor 1 VOC4CAT:0007794']
  basis: direct
  note: voc4cat:0007794 is the class_uri of Precursor, the range of had_input_entity.
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_1].has_qualitative_attribute
  value:
    value: InChI=1S/2NO3.4H3N.Pt/c2*2-1(3)4;;;;;/h;;4*1H3;/q2*-1;;;;;+2
    title: InChI
    rdf_type:
      id: CHEMINF:000113
      title: InChI descriptor
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!L3, 'Precursor 1 Inchi']
  basis: schema-forced
  note: Same as column G (Precursor has no inchi slot).
- target: was_generated_by[SYN_JLCAT03].had_input_entity[PREC_JLCAT03_1].precursor_quantity
  value:
    value: 100.9
    unit: https://qudt.org/vocab/unit/MilliGM
    has_quantity_type: http://qudt.org/vocab/quantitykind/Mass
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!M3, 'precursor quantity 1 VOC4CAT:0008118']
  basis: direct
  note: 'voc4cat:0008118 is the slot_uri of precursor_quantity (Precursor). unit from the unit row: ''mg''
    -> MilliGM'
- target: was_generated_by[SYN_JLCAT03].realized_plan.plan_designator
  value: voc4cat:0007028
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!P3, 'PreparationMethod VOC4CAT:0007016']
  basis: deduced
  note: voc4cat:0007016 is the class_uri of the abstract PreparationMethod. The value 'Impregnation' names
    its subclass Impregnation (class_uri voc4cat:0007028, voc4cat 'impregnation'), which the plan declares
    with plan_designator so that its impregnation, drying and calcination slots can be used.
- target: was_generated_by[SYN_JLCAT03].realized_plan.title
  value: Impregnation
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!P3, 'PreparationMethod VOC4CAT:0007016']
  basis: direct
  note: The preparation method name is used as the title of the realized plan.
- target: was_generated_by[SYN_JLCAT03].realized_plan.impregnation_type
  value: incipient_wetness
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!Q3, 'impregnation type VOC4CAT:0008119']
  basis: direct
  note: voc4cat:0008119 is the slot_uri of impregnation_type. The cell names voc4cat:0007806 'incipient
    wetness impregnation', which is the permissible value incipient_wetness of ImpregnationTypeEnum (the
    enum value has no `meaning` yet).
- target: was_generated_by[SYN_JLCAT03].realized_plan.impregnation_temperature
  value:
    value: 25
    unit: https://qudt.org/vocab/unit/DEG_C
    has_quantity_type: http://qudt.org/vocab/quantitykind/Temperature
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!R3, 'impregnation temperature VOC4CAT:0008121']
  basis: direct
  note: 'voc4cat:0008121 is the slot_uri of impregnation_temperature (Impregnation). unit from the unit
    row: ''degC'' -> DEG_C'
- target: was_generated_by[SYN_JLCAT03].realized_plan.drying_device
  value: oven
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!S3, 'drying device VOC4CAT:0008122']
  basis: direct
  note: voc4cat:0008122 is the slot_uri of drying_device (DryingMixin, used by Impregnation).
- target: was_generated_by[SYN_JLCAT03].realized_plan.description
