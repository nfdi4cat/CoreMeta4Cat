  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!T3, 'drying duration VOC4CAT:0008206']
  basis: fallback
  note: voc4cat:0008206 is the slot_uri of has_drying_duration. A Duration needs a number; the text 'over
    night' is kept verbatim in the plan description instead. Not a number, so kept as text.
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_drying_atmosphere
  value:
    value: air
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!U3, 'drying atmosphere VOC4CAT:0008208']
  basis: direct
  note: voc4cat:0008208 is the slot_uri of has_drying_atmosphere (DryingMixin).
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_drying_temperature
  value:
    value: 70
    unit: https://qudt.org/vocab/unit/DEG_C
    has_quantity_type: http://qudt.org/vocab/quantitykind/Temperature
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!V3, 'drying temperature VOC4CAT:0008207']
  basis: direct
  note: 'voc4cat:0008207 is the slot_uri of has_drying_temperature (DryingMixin). unit from the unit row:
    ''degC'' -> DEG_C'
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_calcination_atmosphere
