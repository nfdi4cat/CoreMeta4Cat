  basis: direct
  note: Label names has_calcination_atmosphere (CalcinationMixin). SIO:000008 is its slot_uri, but also
    that of many other slots, so the label decides.
- target: was_generated_by[SYN_JLCAT03].carried_out_by[DEV_JLCAT03_calcination].title
  value: tube furnace
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!X3, 'calcination device']
  basis: deduced
  note: No calcination-device slot exists. Synthesis.carried_out_by takes the equipment used in the preparation
    (its description names furnaces), so the tube furnace is a Device there; its role is kept in the description.
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_calcination_heating_rate
  value:
    value: 500
    unit: https://qudt.org/vocab/unit/K-PER-HR
    has_quantity_type: http://qudt.org/vocab/quantitykind/TemperaturePerTime
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!Y3, 'calcination heating rate VOC4CAT:0008116']
  basis: direct
  note: 'voc4cat:0008116 is the slot_uri of has_calcination_heating_rate (CalcinationMixin). unit from
    the unit row: ''K/h'' -> K-PER-HR'
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_calcination_gas_flow_rate
  value:
    value: 15
    has_quantity_type: http://qudt.org/vocab/quantitykind/VolumeFlowRate
    description: 15 nl/h as given in the workbook; there is no QUDT unit for 'nl/h'
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!Z3, 'calcination gas flow rate VOC4CAT:0000056']
  basis: direct
  note: 'voc4cat:0000056 is the slot_uri of has_calcination_gas_flow_rate (CalcinationMixin). unit from
    the unit row: ''nl/h''. Read as normal litres per hour (nanolitres per hour, the literal SI reading
    of "nl", is implausible for a calcination gas flow). QUDT has no unit for normal litres, so no unit
    IRI is set; the unit text is kept in the description.'
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_calcination_dwelling_time
  value:
    value: 4
    unit: https://qudt.org/vocab/unit/HR
    has_quantity_type: http://qudt.org/vocab/quantitykind/Time
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!AA3, 'calcination dwelling time VOC4CAT:0000060']
  basis: direct
  note: 'voc4cat:0000060 is the slot_uri of has_calcination_dwelling_time (CalcinationMixin). unit from
    the unit row: ''h'' -> HR'
- target: was_generated_by[SYN_JLCAT03].realized_plan.has_calcination_temperature_range
  value:
    max_value: 700
    unit: https://qudt.org/vocab/unit/DEG_C
    has_quantity_type: http://qudt.org/vocab/quantitykind/Temperature
    description: final calcination temperature (voc4cat:0000058); initial temperature not stated
  source: TestDataSet_CoreMeta4Cat.xlsx [Synthesis!AB3, 'calcination final temperature voc4cat:0000058']
  basis: deduced
  note: 'voc4cat:0000058 ''calcination final temperature'' has no slot of its own: the schema collapses
    initial and final calcination temperature into has_calcination_temperature_range ("initial -> final"),
    so the final temperature is the max_value. min_value stays empty. unit from the unit row: ''degC''
    -> DEG_C'
